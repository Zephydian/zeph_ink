name: Feature request
description: Suggest an improvement to Zeph#Ink
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would it work? Mockups welcome.
    validations:
      required: true
  - type: checkboxes
    id: minimal
    attributes:
      label: Minimal check
      options:
        - label: This keeps documents plain, standard markdown and needs no network access
