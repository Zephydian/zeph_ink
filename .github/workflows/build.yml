# Builds the app (Release, as shipped) and runs the tests on every pull request and every push to main.
name: build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: cd app && xcodegen
      # Warnings count as errors: project.yml sets that for the app and its tests.
      - name: Build Release
        run: |
          xcodebuild -project app/ZephInk.xcodeproj -scheme ZephInk -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath app/build build
      - name: Test
        run: |
          xcodebuild -project app/ZephInk.xcodeproj -scheme ZephInk -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath app/build test
      # If the app crashes while testing, print the crash report (which line, which thread).
      - name: Show crash reports
        if: failure()
        run: |
          for report in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -2); do
            echo "=== $report"
            python3 -c 'import json,sys; t=open(sys.argv[1]).read(); b=json.loads(t[t.index(chr(10))+1:]); print(b.get("exception"), b.get("termination",{}).get("indicator")); th=b["threads"][b.get("faultingThread",0)]; [print(" ", f.get("symbol","?")[:160], f.get("sourceFile",""), f.get("sourceLine","")) for f in th["frames"][:30]]' "$report" || head -c 4000 "$report"
          done
